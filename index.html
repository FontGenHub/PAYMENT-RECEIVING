<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyPaisa - Payment Received</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            margin: 0;
            padding: 15px;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 24px 18px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        /* Top Title */
        .main-heading {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 18px;
            letter-spacing: 0.3px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .logo {
            background-color: #00a651;
            color: white;
            font-weight: bold;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .title-group {
            text-align: left;
        }

        .title {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 11px;
            color: #9ca3af;
        }

        .account-box {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 18px;
        }

        .acc-label {
            font-size: 10px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .acc-number {
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        .pending-text {
            font-size: 13px;
            color: #10b981;
            margin-bottom: 18px;
            font-weight: 600;
        }

        .btn {
            background: linear-gradient(135deg, #00a651, #008741);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 166, 81, 0.4);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* Fullscreen Jumpscare Overlay */
        #jumpscare-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .scary-face {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: shake 0.04s infinite;
        }

        @keyframes shake {
            0% { transform: translate(3px, 3px) rotate(0deg); }
            25% { transform: translate(-4px, 1px) rotate(2deg); }
            50% { transform: translate(2px, -3px) rotate(-2deg); }
            75% { transform: translate(-2px, 2px) rotate(1deg); }
            100% { transform: translate(1px, -1px) rotate(0deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Upar Heading -->
        <div class="main-heading">EasyPaisa Payment Received</div>

        <div class="header">
            <div class="logo">easypaisa</div>
            <div class="title-group">
                <div class="title">Quick Transfer</div>
                <div class="subtitle">Secure Gateway</div>
            </div>
        </div>

        <div class="account-box">
            <div class="acc-label">Receiving Account</div>
            <div class="acc-number">0312-***5678</div>
        </div>

        <div class="pending-text">🎉 Amount: Rs. 5,000 Credited</div>

        <button class="btn" onclick="triggerJumpscare()">Receive Your Payment</button>
    </div>

    <!-- Jumpscare Fullscreen Overlay -->
    <div id="jumpscare-overlay">
        <img src="https://images.unsplash.com/photo-1509248961158-e54f6934749c?q=80&w=1200&auto=format&fit=crop" class="scary-face" alt="Jumpscare">
    </div>

    <script>
        let audioCtx;

        function playScreamSound() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                let osc1 = audioCtx.createOscillator();
                let gain1 = audioCtx.createGain();
                osc1.type = 'sawtooth';
                osc1.frequency.setValueAtTime(1600, audioCtx.currentTime);
                osc1.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 2.5);
                
                gain1.gain.setValueAtTime(1.0, audioCtx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2.5);
                
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                
                osc1.start();
                osc1.stop(audioCtx.currentTime + 2.5);

                let osc2 = audioCtx.createOscillator();
                let gain2 = audioCtx.createGain();
                osc2.type = 'square';
                osc2.frequency.setValueAtTime(70, audioCtx.currentTime);
                
                gain2.gain.setValueAtTime(1.0, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2.5);
                
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                
                osc2.start();
                osc2.stop(audioCtx.currentTime + 2.5);
            } catch (e) {
                console.log("Audio started");
            }
        }

        function triggerJumpscare() {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }

            playScreamSound();
            document.getElementById('jumpscare-overlay').style.display = 'flex';
        }
    </script>
</body>
</html>
